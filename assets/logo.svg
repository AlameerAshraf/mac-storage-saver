<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">mac-storage-saver</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4fe0"/>
      <stop offset="0.55" stop-color="#2a3bb0"/>
      <stop offset="1" stop-color="#0f7a5a"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="free" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9f6d2"/>
      <stop offset="1" stop-color="#4cd38b"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#06103a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App-icon tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="120" rx="56" fill="url(#gloss)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>

  <!-- Storage ring: track, then tier segments (circumference of r=72 is 452.4) -->
  <g transform="rotate(-90 128 128)" filter="url(#soft)">
    <circle cx="128" cy="128" r="72" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="22"/>
    <circle cx="128" cy="128" r="72" fill="none" stroke="url(#free)" stroke-width="22" stroke-linecap="round"
            stroke-dasharray="248 452.4"/>
    <circle cx="128" cy="128" r="72" fill="none" stroke="#ffc85c" stroke-width="22" stroke-linecap="round"
            stroke-dasharray="58 452.4" stroke-dashoffset="-272"/>
    <circle cx="128" cy="128" r="72" fill="none" stroke="#9cc4ff" stroke-width="22" stroke-linecap="round"
            stroke-dasharray="40 452.4" stroke-dashoffset="-354"/>
  </g>

  <!-- Sparkle: freed space -->
  <path d="M128 92 C131 115 141 125 164 128 C141 131 131 141 128 164 C125 141 115 131 92 128 C115 125 125 115 128 92 Z"
        fill="#ffffff"/>
  <path d="M200 38 C201.6 48 205.5 52 216 54 C205.5 56 201.6 60 200 70 C198.4 60 194.5 56 184 54 C194.5 52 198.4 48 200 38 Z"
        fill="#ffffff" fill-opacity="0.9"/>
</svg>
